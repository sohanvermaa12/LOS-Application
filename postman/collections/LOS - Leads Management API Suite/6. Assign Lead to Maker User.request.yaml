$kind: http-request
description: Assigns lead to an active Maker user (e.g. EMP-HDFC-002). Sets leadStatus = ASSIGNED.
url: "{{baseUrl}}/api/v1/leads/{{leadId}}/assign"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: text
  content: |-
    {
      "employeeId": "EMP-HDFC-002",
      "assignedBy": "EMP-HDFC01-47AA80"
    }
order: 7000
