scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.leadId) {
              pm.collectionVariables.set('leadId', jsonData.leadId);
              console.log('Saved leadId: ' + jsonData.leadId);
          }
      }
    language: text/javascript
order: 3000
