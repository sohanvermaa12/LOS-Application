$kind: http-request
description: "Unified single REST endpoint saving all 4 sections (Personal, Loan, Income, Referral) in a single transaction. Automatically assigns next sequential leadId (format: LDYYYYMM####) and sets leadStatus = NEW."
url: "{{baseUrl}}/api/v1/leads"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: text
  content: |-
    {
      "customerName": "Aarav Singhania",
      "dateOfBirth": "1992-07-25",
      "age": 34,
      "customerType": "Individual",
      "panNumber": "ABCDE1234F",
      "panValidationStatus": "VERIFIED",
      "aadhaarNumber": "123456789012",
      "aadhaarValidationStatus": "VERIFIED",
      "residentialStatus": "Resident",
      "gender": "Male",
      "maritalStatus": "Married",
      "passportNumber": "P9876543",
      "passportExpiryDate": "2032-05-19",
      "emailAddress": "aarav.singhania@example.com",
      "pinCode": "400001",
      "numberOfDependents": 2,
      "loanProductType": "Personal Loan",
      "loanAmount": 1200000.0,
      "purposeOfLoan": "Home Renovation",
      "tenure": 36,
      "numberOfInstalments": 36,
      "emi": 40123.0,
      "interestRate": 11.5,
      "totalInterest": 244428.0,
      "securityAmount": 0.0,
      "downPaymentCollateral": "50000.00",
      "employmentType": "Salaried",
      "annualIncome": 1800000.0,
      "designation": "Senior Engineer",
