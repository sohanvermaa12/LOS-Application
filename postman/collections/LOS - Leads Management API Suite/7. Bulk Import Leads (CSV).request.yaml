$kind: http-request
description: Bulk import leads from CSV attachment. Returns summary count and row-level errors.
url: "{{baseUrl}}/api/v1/leads/import"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
      description: Attach a CSV file formatted as sample_leads.csv
order: 8000
