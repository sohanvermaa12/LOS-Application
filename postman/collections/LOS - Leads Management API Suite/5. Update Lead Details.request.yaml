method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: text
  content: |-
    {
      "loanAmount": 1500000.0,
      "tenure": 48,
      "numberOfInstalments": 48,
      "emi": 39200.0,
      "annualIncome": 2100000.0,
      "designation": "Lead Architect"
    }
order: 6000
