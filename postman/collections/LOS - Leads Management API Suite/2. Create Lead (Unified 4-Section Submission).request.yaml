      "loanToValueRatio": 0.70,
      "debtServiceCoverageRatio": 1.45,
      "netDisposableIncome": 85000.0,
      "leadAcquisitionChannel": "Website",
      "date": "2026-10-17",
      "sourcingAgentPartnerId": "AGT-555",
      "agentPartnerName": "Apex Partners",
      "employeeId": "EMP-HDFC-001",
      "employeeName": "Bank Admin"
